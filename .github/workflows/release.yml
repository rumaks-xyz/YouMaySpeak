name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create Zip Archive
        run: zip -r release.zip . -x ".*"
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release.zip
